name: Check and deploy Folio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Determine site path
        run: |
          if [ -n "$CUSTOM_BASE" ]; then
            echo "BASE_PATH=$CUSTOM_BASE" >> "$GITHUB_ENV"
          elif [ "$REPO_NAME" = "$OWNER.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO_NAME/" >> "$GITHUB_ENV"
          fi
        env:
          CUSTOM_BASE: ${{ vars.BASE_PATH }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check installation assets, offline use, and PDF downloads
        run: |
          node server.mjs > /tmp/folio-server.log 2>&1 &
          pnpm test:pwa
        env:
          APP_URL: http://127.0.0.1:5173${{ env.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
